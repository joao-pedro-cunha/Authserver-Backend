spring:
  application:
    name: authserver
  web:
    error:
      whitelabel:
        enabled: false
      include-message: always
      include-binding-errors: always
      include-stacktrace: never
      include-exception: true
  datasource:
    url: jdbc:h2:mem:db
    username: sa
    password: sa
  jpa:
    show-sql: true
  h2:
    console:
      enabled: true

  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    context-path: /api
springdoc:
  swagger-ui:
    use-root-path: true

security:
  jwt:
    # Em produção defina a variável de ambiente JWT_SECRET (mínimo 32 caracteres).
    # Sem ela, uma chave temporária é gerada a cada início e os tokens antigos deixam de valer.
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000

logging:
  file:
    path: ./logs
  level:
    br.pucpr.authserver: DEBUG
